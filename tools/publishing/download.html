<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: dark; --bg: #141a24; --panel: #1d2433; --ink: #ece6d6; --muted: #a9b0bf; --gold: #f2d98a; --leaf: #5fa257; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 20%, #2a3346, var(--bg) 70%); color: var(--ink); font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 620px; width: 100%; background: var(--panel); border: 1px solid #39445c; border-radius: 16px; padding: 32px; text-align: center; }
  h1 { margin: 0 0 8px; color: var(--gold); font-size: 2.2rem; letter-spacing: 0.02em; }
  p { margin: 0 0 20px; color: var(--muted); }
  a.download { display: inline-block; padding: 14px 28px; border-radius: 10px; background: var(--leaf); color: #10170f; font-weight: bold; text-decoration: none; }
  a.download:hover { filter: brightness(1.1); }
  small { display: block; margin-top: 18px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p>{{DESCRIPTION}}</p>
  <a class="download" href="{{ZIP}}" download>Download for Windows</a>
  <small>Windows 64-bit · unzip and run · built {{BUILT}}</small>
</main>
</body>
</html>
